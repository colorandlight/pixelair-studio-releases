<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelAir Studio — Color+Light</title>
  <link rel="icon" type="image/png" href="pixelair-studio-icon.png">
  <meta name="description" content="PixelAir Studio: write, preview and run animations on Fluora lamps. Download the latest notarized build.">
  <style>
    :root {
      --bg: #0b0d10;
      --text: #f4f6f8;
      --muted: #9aa3ad;
      --blue: #3ea5f8;
      --blue-dark: #1a5299;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main {
      width: min(440px, 100%);
      text-align: center;
    }
    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 28px;
      border-radius: 20px;
      overflow: hidden;
    }
    .mark img { display: block; width: 100%; height: 100%; }
    h1 {
      font-size: 42px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 0 0 10px;
    }
    p.lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }
    a.download {
      display: inline-block;
      background: var(--blue);
      color: #061018;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 13px 22px;
      border-radius: 10px;
    }
    a.download:hover { background: #62b6ff; }
    .meta {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    footer {
      margin-top: 48px;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark">
      <img src="pixelair-studio-icon.png" width="88" height="88" alt="PixelAir Studio">
    </div>
    <h1>PixelAir Studio</h1>
    <p class="lede">Write, preview and run animations on Fluora lamps.</p>
    <a class="download" id="download"
       href="https://github.com/colorandlight/pixelair-studio-releases/releases/latest">
      Download PixelAir Studio
    </a>
    <p class="meta">macOS 26+ · Apple silicon · Developer ID signed and notarized</p>
    <footer>
      <a href="https://colorandlight.art">Color+Light</a>
    </footer>
  </main>
  <script>
    fetch("https://api.github.com/repos/colorandlight/pixelair-studio-releases/releases/latest")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (rel) {
        var dmg = (rel.assets || []).find(function (a) { return /\.dmg$/i.test(a.name); });
        if (!dmg) return;
        var version = String(rel.tag_name || "").replace(/^v/, "");
        if (!/^\d+\.\d+/.test(version)) return;
        document.getElementById("download").href = dmg.browser_download_url;
        document.getElementById("download").textContent = "Download PixelAir Studio " + version;
      })
      .catch(function () {});
  </script>
</body>
</html>
